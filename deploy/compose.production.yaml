name: axelyn-knowledge

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  knowledge:
    image: axelyn-knowledge-app:${AXELYN_KNOWLEDGE_RELEASE:?Set AXELYN_KNOWLEDGE_RELEASE}
    restart: unless-stopped
    stop_grace_period: 30s
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEMORY_LIMIT:-1g}
    pids_limit: 256
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    env_file:
      - path: ../../.env
        required: true
    ports:
      - "127.0.0.1:${APP_PORT:-3001}:3000"
    networks:
      - postgres
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    logging: *default-logging

  migrate:
    profiles: ["tools"]
    image: axelyn-knowledge-migrator:${AXELYN_KNOWLEDGE_RELEASE:?Set AXELYN_KNOWLEDGE_RELEASE}
    env_file:
      - path: ../../.env
        required: true
    networks:
      - postgres
    logging: *default-logging

networks:
  postgres:
    name: ${POSTGRES_NETWORK:-axelyn-signal_default}
    external: true
