services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: axelyn_knowledge
      POSTGRES_USER: axelyn_knowledge
      POSTGRES_PASSWORD: axelyn_knowledge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - axelyn-knowledge-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axelyn_knowledge -d axelyn_knowledge"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      target: development
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://axelyn_knowledge:axelyn_knowledge@db:5432/axelyn_knowledge
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  migrate:
    profiles: ["tools"]
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://axelyn_knowledge:axelyn_knowledge@db:5432/axelyn_knowledge
    depends_on:
      db:
        condition: service_healthy

volumes:
  axelyn-knowledge-postgres:
