openapi: 3.1.0
info:
  title: Axelyn Knowledge API
  version: 1.0.0
  description: Provenance-aware associative memory API. Editorial approval never implies factual verification.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
tags:
  - name: Health
  - name: Sources
  - name: Knowledge
  - name: Retrieval
paths:
  /api/v1/health/live:
    get:
      tags: [Health]
      summary: Process liveness
      security: []
      responses:
        "200":
          description: Process is live.
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: { const: live }
                  service: { const: axelyn-knowledge }
  /api/v1/health/ready:
    get:
      tags: [Health]
      summary: Database and pgvector readiness
      security: []
      responses:
        "200":
          description: Dependencies are ready.
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /api/v1/sources:
    post:
      tags: [Sources]
      summary: Ingest an immutable source snapshot idempotently
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SourceIngestion"
      responses:
        "201":
          description: Source created; extraction may be succeeded, failed, or pending.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "200":
          description: Identical immutable-snapshot replay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestionResult"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /api/v1/sources/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Sources]
      summary: Get an immutable source snapshot
      responses:
        "200":
          description: Source snapshot.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Source" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/sources/{id}/extractions:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Sources]
      summary: Start or retry structured extraction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspace_id]
              properties:
                workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
      responses:
        "202":
          description: Extraction attempt completed synchronously or recorded as failed for retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extraction" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/extractions/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Workspace"
    get:
      tags: [Sources]
      summary: Inspect an extraction attempt
      responses:
        "200":
          description: Extraction audit record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extraction" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/v1/knowledge/inbox:
    get:
      tags: [Knowledge]
      summary: List proposed nodes and relationships with provenance
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Review inbox.
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/v1/knowledge/nodes:
    get:
      tags: [Knowledge]
      summary: Search and filter knowledge nodes
      parameters:
        - $ref: "#/components/parameters/Workspace"
        - { name: query, in: query, schema: { type: string, maxLength: 500 } }
        - { name: type, in: query, schema: { $ref: "#/components/schemas/NodeType" } }
        - { name: origin, in: query, schema: { $ref: "#/components/schemas/Origin" } }
        - { name: verification, in: query, schema: { $ref: "#/components/schemas/Verification" } }
        - { name: lifecycle_status, in: query, schema: { $ref: "#/components/schemas/Lifecycle" } }
        - { name: sensitivity, in: query, schema: { $ref: "#/components/schemas/Sensitivity" } }
        - { name: cursor, in: query, schema: { type: string } }
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
          }
      responses:
        "200":
          description: Cursor-paginated node list.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Node" }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [Knowledge]
      summary: Create an atomic knowledge proposal or node
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodeCreate" }
      responses:
        "201":
          description: Node created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/knowledge/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Knowledge]
      summary: Get a node, provenance, revisions, graph, contradictions, and usage
      parameters:
        - $ref: "#/components/parameters/Workspace"
      responses:
        "200": { description: Detailed node. }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Knowledge]
      summary: Create a protected node revision
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NodePatch" }
      responses:
        "200":
          description: Updated node.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Node" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/knowledge/nodes/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Knowledge]
      summary: Activate editorially approved knowledge without changing verification
      requestBody:
        $ref: "#/components/requestBodies/LifecycleAction"
      responses:
        "200": { description: Active node with verification preserved. }
  /api/v1/knowledge/nodes/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Knowledge]
      summary: Reject proposed knowledge
      requestBody:
        $ref: "#/components/requestBodies/LifecycleAction"
      responses:
        "200": { description: Rejected node. }
  /api/v1/knowledge/nodes/{id}/archive:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Knowledge]
      summary: Archive without erasing history
      requestBody:
        $ref: "#/components/requestBodies/LifecycleAction"
      responses:
        "200": { description: Archived node. }
  /api/v1/knowledge/nodes/{id}/merge:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Knowledge]
      summary: Human-reviewed conservative merge into a target node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                [
                  workspace_id,
                  target_node_id,
                  expected_source_version,
                  expected_target_version,
                  reason,
                ]
              properties:
                workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
                target_node_id: { type: string, format: uuid }
                expected_source_version: { type: integer, minimum: 1 }
                expected_target_version: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3, maxLength: 1000 }
      responses:
        "200": { description: Consolidated target node with aliases and provenance. }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/v1/knowledge/nodes/{id}/neighborhood:
    parameters:
      - $ref: "#/components/parameters/Id"
      - $ref: "#/components/parameters/Workspace"
      - { name: depth, in: query, schema: { type: integer, minimum: 1, maximum: 3, default: 1 } }
      - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    get:
      tags: [Knowledge]
      summary: Get a bounded cycle-safe neighborhood
      responses:
        "200": { description: Nodes and directed active edges. }
  /api/v1/knowledge/edges/{id}/approve:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Knowledge]
      summary: Approve a proposed relationship after both nodes are active
      requestBody:
        $ref: "#/components/requestBodies/LifecycleAction"
      responses:
        "200": { description: Active edge. }
  /api/v1/knowledge/edges/{id}/reject:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Knowledge]
      summary: Reject a proposed relationship
      requestBody:
        $ref: "#/components/requestBodies/LifecycleAction"
      responses:
        "200": { description: Rejected edge. }
  /api/v1/context/retrieve:
    post:
      tags: [Retrieval]
      summary: Retrieve a bounded trust-separated working-memory pack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RetrievalRequest" }
      responses:
        "200":
          description: Seeds, recalled nodes, score components, paths, contradictions, and context pack.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RetrievalResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /api/v1/usage:
    post:
      tags: [Retrieval]
      summary: Report downstream outcomes for nodes supplied by a retrieval run
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsageRequest" }
      responses:
        "201":
          description: Outcome recorded and capped usefulness updated; verification is unchanged.
        "400": { $ref: "#/components/responses/BadRequest" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Workspace:
      name: workspace_id
      in: query
      required: true
      schema: { $ref: "#/components/schemas/WorkspaceId" }
      description: Must be present in the authenticated service token allowlist.
  requestBodies:
    LifecycleAction:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [workspace_id, reason]
            properties:
              workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
              reason: { type: string, minLength: 3, maxLength: 1000 }
  responses:
    BadRequest:
      description: Invalid input or integrity boundary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Generic authentication failure.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Identity cannot access the workspace.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource is absent from the authorized workspace.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Idempotency, version, or consolidation conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    PayloadTooLarge:
      description: Request body exceeds the configured byte ceiling.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Required dependency is unavailable.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    WorkspaceId:
      type: string
      pattern: "^[a-z0-9][a-z0-9_-]*$"
      minLength: 2
      maxLength: 64
    NodeType:
      type: string
      enum:
        [
          EPISODE,
          SIGNAL,
          OBSERVATION,
          CLAIM,
          CONCEPT,
          ENTITY,
          EXPERIENCE,
          EVIDENCE,
          CONSTRAINT,
          COUNTERARGUMENT,
          POSITION,
          AUDIENCE_INSIGHT,
          VOICE_PATTERN,
          ARTIFACT,
        ]
    EdgeType:
      type: string
      enum:
        [
          DERIVED_FROM,
          SUPPORTS,
          CONTRADICTS,
          REFINES,
          SUPERSEDES,
          CAUSES,
          APPLIES_TO,
          EXAMPLE_OF,
          ABOUT,
          USED_IN,
          EXPRESSED_IN,
          RELATED_TO,
        ]
    Origin:
      type: string
      enum: [USER_SIGNAL, OPERATOR, AI_DERIVED, APPROVED_COPY, EXTERNAL_SOURCE]
    Verification:
      type: string
      enum: [UNVERIFIED, HUMAN_CONFIRMED, SOURCE_SUPPORTED, DISPUTED]
    Lifecycle:
      type: string
      enum: [PROPOSED, ACTIVE, REJECTED, ARCHIVED]
    Sensitivity:
      type: string
      enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED]
    SourceIngestion:
      type: object
      additionalProperties: false
      required:
        [
          workspace_id,
          source_system,
          source_type,
          external_id,
          source_version,
          content,
          metadata,
          occurred_at,
        ]
      properties:
        workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
        source_system: { type: string, minLength: 1, maxLength: 100 }
        source_type:
          type: string
          enum:
            [
              signal,
              generated_insight,
              operator_evidence,
              approved_revision,
              published_artifact,
              external_source,
              correction,
            ]
        external_id: { type: string, minLength: 1, maxLength: 300 }
        source_version: { type: integer, minimum: 1 }
        content: { type: string, minLength: 1, maxLength: 1000000 }
        metadata: { type: object, additionalProperties: true }
        occurred_at: { type: string, format: date-time }
        auto_extract: { type: boolean, default: true }
        verification_assertion:
          type: object
          required: [level, actor, reason]
          properties:
            level: { type: string, enum: [HUMAN_CONFIRMED, SOURCE_SUPPORTED] }
            actor: { type: string }
            reason: { type: string }
    Source:
      allOf:
        - $ref: "#/components/schemas/SourceIngestion"
        - type: object
          required: [id, content_hash, created_by, created_at]
          properties:
            id: { type: string, format: uuid }
            content_hash: { type: string, pattern: "^[a-f0-9]{64}$" }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
    Extraction:
      type: object
      required: [id, workspace_id, source_id, status, attempt]
      properties:
        id: { type: string, format: uuid }
        workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
        source_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED] }
        attempt: { type: integer, minimum: 1 }
        gateway: { type: [string, "null"] }
        model: { type: [string, "null"] }
        proposals: { type: [object, "null"] }
        error_code: { type: [string, "null"] }
        error_message: { type: [string, "null"] }
    IngestionResult:
      type: object
      required: [source, replayed, extraction]
      properties:
        source: { $ref: "#/components/schemas/Source" }
        replayed: { type: boolean }
        extraction:
          oneOf:
            - $ref: "#/components/schemas/Extraction"
            - type: "null"
    SourceLink:
      type: object
      required: [source_id, excerpt]
      properties:
        source_id: { type: string, format: uuid }
        excerpt: { type: string, minLength: 1, maxLength: 4000 }
    NodeCreate:
      type: object
      required: [workspace_id, type, title, canonical_statement, origin]
      properties:
        workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
        type: { $ref: "#/components/schemas/NodeType" }
        title: { type: string, minLength: 1, maxLength: 240 }
        canonical_statement: { type: string, minLength: 1, maxLength: 4000 }
        metadata: { type: object, additionalProperties: true, default: {} }
        origin: { $ref: "#/components/schemas/Origin" }
        verification: { $ref: "#/components/schemas/Verification" }
        lifecycle_status: { $ref: "#/components/schemas/Lifecycle" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        confidence: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        importance: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        salience: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        source_links:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/SourceLink" }
    Node:
      allOf:
        - $ref: "#/components/schemas/NodeCreate"
        - type: object
          required: [id, statement_hash, usefulness_score, current_version, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            statement_hash: { type: string }
            usefulness_score: { type: number, minimum: 0.1, maximum: 0.9 }
            current_version: { type: integer, minimum: 1 }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    NodePatch:
      type: object
      required: [workspace_id, expected_version, change_reason]
      properties:
        workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
        expected_version: { type: integer, minimum: 1 }
        title: { type: string, minLength: 1, maxLength: 240 }
        canonical_statement: { type: string, minLength: 1, maxLength: 4000 }
        metadata: { type: object, additionalProperties: true }
        verification: { $ref: "#/components/schemas/Verification" }
        sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        importance: { type: number, minimum: 0, maximum: 1 }
        salience: { type: number, minimum: 0, maximum: 1 }
        change_reason: { type: string, minLength: 3, maxLength: 1000 }
    RetrievalRequest:
      type: object
      required: [workspace_id, query, purpose, requesting_system]
      properties:
        workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
        query: { type: string, minLength: 1, maxLength: 2000 }
        purpose: { type: string, minLength: 1, maxLength: 500 }
        requesting_system: { type: string, minLength: 1, maxLength: 100 }
        audience: { type: string, maxLength: 500, default: general }
        desired_node_types:
          type: array
          items: { $ref: "#/components/schemas/NodeType" }
        allowed_verification_levels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Verification" }
        maximum_sensitivity: { $ref: "#/components/schemas/Sensitivity" }
        maximum_graph_depth: { type: integer, minimum: 0, maximum: 3, default: 2 }
        result_limit: { type: integer, minimum: 1, maximum: 50, default: 12 }
        token_budget: { type: integer, minimum: 64, maximum: 32000, default: 2000 }
        pinned_node_ids:
          type: array
          maxItems: 25
          items: { type: string, format: uuid }
    RetrievalResponse:
      type: object
      required: [retrieval_run_id, embedding_available, seed_results, items, context_pack]
      properties:
        retrieval_run_id: { type: string, format: uuid }
        embedding_available: { type: boolean }
        seed_results: { type: array, items: { type: object } }
        items:
          type: array
          items:
            type: object
            required:
              [
                node_id,
                type,
                canonical_statement,
                trust,
                sensitivity,
                final_score,
                score_components,
                why_recalled,
                supporting_provenance,
                graph_path,
                contradicting_nodes,
                estimated_tokens,
              ]
            properties:
              node_id: { type: string, format: uuid }
              type: { $ref: "#/components/schemas/NodeType" }
              canonical_statement: { type: string }
              trust: { type: object }
              sensitivity: { $ref: "#/components/schemas/Sensitivity" }
              final_score: { type: number, minimum: 0, maximum: 1 }
              score_components: { type: object }
              why_recalled: { type: string }
              supporting_provenance: { type: array, items: { type: object } }
              graph_path: { type: object }
              contradicting_nodes: { type: array, items: { type: object } }
              estimated_tokens: { type: integer }
        context_pack: { type: object }
    UsageRequest:
      type: object
      required: [workspace_id, retrieval_run_id, node_ids, outcome]
      properties:
        workspace_id: { $ref: "#/components/schemas/WorkspaceId" }
        retrieval_run_id: { type: string, format: uuid }
        node_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        outcome:
          type: string
          enum: [USED, IGNORED, HELPED_APPROVAL, CONTRIBUTED_TO_REJECTION, CORRECTED, CONTRADICTED]
        metadata: { type: object, additionalProperties: true, default: {} }
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
        request_id: { type: string }
