name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: axelyn_knowledge_test
          POSTGRES_USER: axelyn_knowledge
          POSTGRES_PASSWORD: axelyn_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axelyn_knowledge -d axelyn_knowledge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://axelyn_knowledge:axelyn_knowledge@127.0.0.1:5432/axelyn_knowledge_test
      TEST_DATABASE_URL: postgresql://axelyn_knowledge:axelyn_knowledge@127.0.0.1:5432/axelyn_knowledge_test
      ALLOW_DEV_OPERATOR: "true"
      DEV_OPERATOR_EMAIL: ci@localhost
      DEFAULT_WORKSPACE: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  deploy:
    name: Deploy production
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production
      url: https://knowledge.axelyn.com
    concurrency:
      group: axelyn-knowledge-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ vars.MEMORA_VPS_HOST }}
      DEPLOY_PORT: ${{ vars.MEMORA_VPS_PORT }}
      DEPLOY_USER: ${{ vars.MEMORA_VPS_USER }}
    steps:
      - name: Validate deployment configuration
        run: |
          set -Eeuo pipefail
          [[ -n "$DEPLOY_HOST" ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]

      - name: Configure restricted SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MEMORA_VPS_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MEMORA_VPS_KNOWN_HOSTS }}
        run: |
          set -Eeuo pipefail
          [[ -n "$SSH_PRIVATE_KEY" ]]
          [[ -n "$SSH_KNOWN_HOSTS" ]]
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/axelyn_knowledge_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/axelyn_knowledge_deploy" >/dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null

      - name: Deploy exact main commit
        run: |
          set -Eeuo pipefail
          ssh \
            -i "$HOME/.ssh/axelyn_knowledge_deploy" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=20 \
            -p "$DEPLOY_PORT" \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "deploy ${GITHUB_SHA}"

      - name: Verify Cloudflare Access boundary
        run: |
          set -Eeuo pipefail
          status_code="$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out '%{http_code}' \
            --max-time 20 \
            https://knowledge.axelyn.com/health/ready)"
          [[ "$status_code" == "302" ]]

      - name: Remove SSH identity
        if: always()
        run: rm -f -- "$HOME/.ssh/axelyn_knowledge_deploy"
