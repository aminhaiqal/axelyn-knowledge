name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: axelyn_knowledge_test
          POSTGRES_USER: axelyn_knowledge
          POSTGRES_PASSWORD: axelyn_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axelyn_knowledge -d axelyn_knowledge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://axelyn_knowledge:axelyn_knowledge@127.0.0.1:5432/axelyn_knowledge_test
      TEST_DATABASE_URL: postgresql://axelyn_knowledge:axelyn_knowledge@127.0.0.1:5432/axelyn_knowledge_test
      ALLOW_DEV_OPERATOR: "true"
      DEV_OPERATOR_EMAIL: ci@localhost
      DEFAULT_WORKSPACE: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
